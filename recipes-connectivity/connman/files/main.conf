[General]
# Keep ConnMan off container interfaces. Otherwise every pod veth gets a
# 169.254/16 address and can take over the default route from eth0, which
# cuts the node off from DNS, registries and Git. The list replaces
# ConnMan's built-in default, so its entries (vmnet..vb-) are repeated.
NetworkInterfaceBlacklist=vmnet,vboxnet,virbr,ifb,ve-,vb-,veth,cni,flannel,vxlan,docker
